<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modal Bootstrap Ejemplo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5 text-center">

<div class="modal fade" id="modalConsulta" tabindex="-1" aria-labelledby="modalConsultaLabel" aria-hidden="true">
                    <div class="modal-dialog modal-xl modal-dialog-centered">
                     <div class="modal-content">

                       <!-- ENCABEZADO DEL MODAL -->
                       <div class="modal-header gradient-header">
                      <h5 class="modal-title" id="modalConsultaLabel">
                        <i class="fa-brands fa-searchengin"></i> Consulta Previa
                       </h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                       </div>

                      <!-- CUERPO DEL MODAL -->
                       <div class="modal-body p-0">
                       <div class="d-flex" style="height: 60vh; overflow: hidden;">

                      <!-- BARRA LATERAL FORMULARIO -->
                        <div id="sidebarForm" class="col-4 border-end d-flex flex-column transition-width" style="overflow-y: auto;">
            
                       <!-- Encabezado interno -->
                       <div class="bg-light border-bottom p-2 d-flex justify-content-between align-items-center">
                       <strong>Panel de Consulta</strong>
                     <button id="btnCerrarSidebar" class="btn-deneg btn-sm btn-outline-secondary" title="Cerrar panel">
                     <i class="fa-solid fa-xmark"></i>
                     </button>
                     </div>

                     <!-- Cuerpo del formulario -->
                     <div class="p-3 flex-grow-1" style="overflow-y: auto;">
                     <form>
                     <div class="mb-3">
                      <label class="form-label">Nombre</label>
                     <input type="text" class="inp-text form-control" placeholder="Ingrese nombre">
                     </div>
                     <div class="mb-3">
                     <label class="form-label">Documento</label>
                     <input type="text" class="inp-text form-control" placeholder="Ingrese documento">
                     </div>
                     <div class="mb-3">
                     <label class="form-label">Fecha</label>
                     <input type="date" class="inp-text form-control">
                     </div>
                     <div class="mb-3">
                     <label class="form-label">Tipo de Consulta</label>
                     <select class="inp-text form-select">
                     <option>General</option>
                     <option>Por ID</option>
                     <option>Por Estado</option>
                     </select>
                     </div>
                     </form>
                     </div>

                    <!-- Pie del formulario -->
                    <div class="border-top bg-light p-2 d-flex justify-content-end gap-2">
                      <button class="btn-deneg btn-secondary btn-sm">Limpiar</button>
                     <button class="btn-active btn-primary btn-sm">Buscar</button>
                     </div>
                     </div>

                    <!-- SECCIÓN TABLA -->
                      <div id="tablaContainer" class="col-8 p-3 transition-width" style="overflow-x: auto;">
            
                   <!-- Botón para volver a mostrar la barra lateral -->
                   <button id="btnMostrarSidebar" class="btn-active btn-sm btn-outline-primary mb-2 d-none">
                   <i class="fa-solid fa-bars"></i> Mostrar panel
                   </button>

                    <table class="table table-striped table-bordere align-middle modern-table">
                        <thead class="bg-light">
                          <tr>
                           <th>Número Radicado</th>
                           <th>Remitente</th>
                           <th>Trámite</th>
                           <th>Fecha</th>
                           <th class="text-center">Opciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                           <td><strong>25000270980</strong></td>
                           <td>Juan Pérez</td>
                           <td>Licencia de construcción</td>
                           <td>27/10/2025</td>
                           <td class="text-center"><i class="fa-solid fa-file-arrow-down icono-detalle"></i></td>
                          </tr>
                          <tr>
                           <td><strong>25000270981</strong></td>
                           <td>María Gómez</td>
                           <td>Solicitud de concepto</td>
                           <td>25/10/2025</td>
                           <td class="text-center"><i class="fa-solid fa-file-arrow-down icono-detalle"></i></td>
                          </tr>
                          <tr>
                           <td><strong>25000270982</strong></td>
                           <td>Carlos Ruiz</td>
                           <td>Radicación de planos</td>
                           <td>23/10/2025</td>
                           <td class="text-center"><i class="fa-solid fa-file-arrow-down icono-detalle"></i></td>
                          </tr>
                        </tbody>
                      </table>

                      <!-- PAGINACIÓN DE MODAL -->
                    <nav aria-label="Page navigation" class="mt-4">
                      <ul class="pagination justify-content-center pagination-modern mb-0">
                        <li class="page-item disabled">
                         <a class="page-link">Anterior</a>
                        </li>
                        <li class="page-item active">
                         <a class="page-link" href="#">1</a>
                        </li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                         <a class="page-link" href="#">Siguiente</a>
                        </li>
                      </ul>
                    </nav>
                          </div>

                      </div>
                    </div>

                   <!-- PIE DEL MODAL -->
                   <div class="modal-footer">
                    <button type="button" class="btn-active btn-secondary" data-bs-dismiss="modal">Relacionar</button>
                   <label>Reemplazar</label>
                   <input type="checkbox">
                   <label>Agrega</label>
                   <input type="checkbox">
                   </div>

                   </div>
                   </div>
                   </div>
                  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Font Awesome (opcional para íconos) -->
  <script src="https://kit.fontawesome.com/a2d9d5a64b.js" crossorigin="anonymous"></script>
</body>
</html>
